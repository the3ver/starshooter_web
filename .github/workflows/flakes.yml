name: Flake-Suche

# Woechentlich jeden Test dreimal ohne Retries unter Last (2 Worker): ein einziger Fehlschlag ist rot.
# Der normale CI-Lauf hat retries: 2 und verdeckt wackelige Tests; dieser Job macht sie sichtbar.
on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flakes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      - name: Tests dreimal ohne Retries
        run: npx playwright test --repeat-each=3 --retries=0 --workers=2 --reporter=dot
